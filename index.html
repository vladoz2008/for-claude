        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, kernelTex);
        gl.uniform1i(uUpdate.uState, 0);
        gl.uniform1i(uUpdate.uKernel, 1);
        gl.uniform2f(uUpdate.uGridSize, gridW, gridH);
        gl.uniform1f(uUpdate.uDt, DT);
        gl.uniform1f(uUpdate.uMu, MU);
        gl.uniform1f(uUpdate.uSigma, SIGMA);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        stateIdx = dst;
      }

      function trailStep() {
        const dst = 1 - trailIdx;
        gl.viewport(0, 0, gridW, gridH);
        gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo[dst]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.useProgram(progTrail);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, stateTex[stateIdx]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, trailTex[trailIdx]);
        gl.uniform1i(uTrail.uState, 0);
        gl.uniform1i(uTrail.uTrailPrev, 1);
        gl.uniform1f(uTrail.uRate, TRAIL_RATE);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        trailIdx = dst;
      }

      function renderDisplay(t) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.useProgram(progDisplay);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, stateTex[stateIdx]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, trailTex[trailIdx]);
        gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, growthTex);
        gl.uniform1i(uDisplay.uState, 0);
        gl.uniform1i(uDisplay.uTrail, 1);
        gl.uniform1i(uDisplay.uGrowth, 2);
        gl.uniform2f(uDisplay.uGridSize, gridW, gridH);
        gl.uniform2f(uDisplay.uResolution, canvas.width, canvas.height);
        gl.uniform1f(uDisplay.uTime, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      // ---- interaction: tap = new creature, drag = soft feeding brush -----------------------
      // The brush is re-applied every single automaton sub-step (not once per rendered frame):
      // scratchpad/tune-stir.cjs showed that with 2-3 sim steps per frame (the adaptive default),
      // a "paint once per frame" brush gets fully erased by that frame's own decay before it is
      // ever seen, because 2-3 consecutive Euler steps can subtract more than a modest brush
      // adds. Painting at the *same* cadence as decay keeps a steady, controllable glow instead.
      let paused = false;
      const pointers = new Map();
      const activeStir = new Map(); // pointerId -> [cx, cy], live position while held & moved
      const CLICK_SLOP = 6; // px

      function eventToCell(e) {
        const rect = canvas.getBoundingClientRect();
        const fx = (e.clientX - rect.left) / Math.max(1, rect.width);
        const fy = (e.clientY - rect.top) / Math.max(1, rect.height);
        return [fx * gridW, fy * gridH];
      }

      function onPointerDown(e) {
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { sx: e.clientX, sy: e.clientY, moved: false });
      }
      function onPointerMove(e) {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        const dx = e.clientX - p.sx, dy = e.clientY - p.sy;
        if (!p.moved && Math.hypot(dx, dy) < CLICK_SLOP) return;
        p.moved = true;
        const [cx, cy] = eventToCell(e);
        activeStir.set(e.pointerId, [cx, cy]);
      }
      function onPointerUp(e) {
        const p = pointers.get(e.pointerId);
        pointers.delete(e.pointerId);
        activeStir.delete(e.pointerId);
        try { canvas.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
        if (p && !p.moved) {
          const [cx, cy] = eventToCell(e);
          drawStamp(cx, cy, Math.random() * Math.PI * 2, Math.random() < 0.5);
        }
      }
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);

      // Applies the feeding brush at every currently-held pointer's live position. Called once
      // per automaton sub-step so painting and decay stay in lockstep regardless of stepsPerFrame.
      function applyActiveStir(seed) {
        if (activeStir.size === 0) return;
        const pts = new Float32Array(MAX_STIR_POINTS * 2);
        let count = 0;
        for (const [cx, cy] of activeStir.values()) {
          if (count >= MAX_STIR_POINTS) break;
          pts[count * 2] = cx; pts[count * 2 + 1] = cy; count++;
        }
        const dst = 1 - stateIdx;
        gl.viewport(0, 0, gridW, gridH);
        gl.bindFramebuffer(gl.FRAMEBUFFER, simFbo[dst]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.useProgram(progStir);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, stateTex[stateIdx]);
        gl.uniform1i(uStir.uState, 0);
        gl.uniform2f(uStir.uGridSize, gridW, gridH);
        gl.uniform2fv(uStir.uPoints, pts);
        gl.uniform1i(uStir.uPointCount, count);
        // Tuned in scratchpad/tune-stir.cjs against the real growth/kernel constants, assuming
        // one brush application per automaton step: below ~0.28 an isolated stroke always
        // dissolves within roughly a second of release (no runaway "spontaneous life"); 0.22
        // sits comfortably under that critical mass while building a clearly visible glow
        // within a few steps of continuous dragging.
        gl.uniform1f(uStir.uRadius, Math.min(gridW, gridH) * 0.04);
        gl.uniform1f(uStir.uAmp, 0.22);
        gl.uniform1f(uStir.uSeed, seed);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        stateIdx = dst;
      }

      // ---- ui buttons -------------------------------------------------------------------------
      const btnSeed = document.createElement('button');
      btnSeed.type = 'button'; btnSeed.className = 'ctl'; btnSeed.textContent = 'Засеять';
      btnSeed.addEventListener('click', () => seedDish());

      const btnClear = document.createElement('button');
      btnClear.type = 'button'; btnClear.className = 'ctl'; btnClear.textContent = 'Очистить';
      btnClear.addEventListener('click', () => clearAll());

      const btnPause = document.createElement('button');
      btnPause.type = 'button'; btnPause.className = 'ctl'; btnPause.textContent = 'Пауза';
      btnPause.setAttribute('aria-pressed', 'false');
      btnPause.addEventListener('click', () => setPaused(!paused));

      ui.appendChild(btnSeed);
      ui.appendChild(btnClear);
      ui.appendChild(btnPause);

      function setPaused(v) {
        paused = v;
        btnPause.setAttribute('aria-pressed', v ? 'true' : 'false');
      }

      function onKey(e) {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
        if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
        else if (e.code === 'KeyR') { seedDish(); }
      }
      window.addEventListener('keydown', onKey);

      // ---- resize: world aspect follows the viewport; only rebuild on a real size change ----
      let resizeTimer = null;
      const ro = new ResizeObserver(() => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const g = computeGrid();
          if (Math.abs(g.w - gridW) >= 8 || Math.abs(g.h - gridH) >= 8) {
            buildGrid(g.w, g.h);
            seedDish();
          }
        }, 200);
      });
      ro.observe(host);

      // ---- main loop ----------------------------------------------------------------------------
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let raf = 0, lastNow = null, simTime = 0;
      function frame(now) {
        raf = requestAnimationFrame(frame);
        const dt = lastNow === null ? 16.7 : Math.min(now - lastNow, 100);
        lastNow = now;
        frameTimes.push(dt);
        if (frameTimes.length >= 30) {
          let sum = 0; for (const v of frameTimes) sum += v;
          const avg = sum / frameTimes.length;
          frameTimes.length = 0;
          if (!fixedQuality) {
            if (avg > 22) quality = Math.max(0.3, quality * 0.85);
            else if (avg < 12) quality = Math.min(1, quality * 1.1);
          }
          if (avg > 26) stepsPerFrame = Math.max(1, stepsPerFrame - 1);
          else if (avg < 14) stepsPerFrame = Math.min(3, stepsPerFrame + 1);
        }
        applyCanvasSize();

        if (!paused) {
          simTime += dt * 0.001;
          // Paint immediately before each decay step, at the same cadence, so a held/dragged
          // brush reaches a stable visible glow instead of being outrun by multi-step decay.
          for (let i = 0; i < stepsPerFrame; i++) {
            applyActiveStir(now * 0.001 + i * 0.017);
            simStep();
          }
          trailStep();
        }

        renderDisplay(reducedMotion ? 0 : simTime);
      }
      raf = requestAnimationFrame(frame);

      return {
        unmount() {
          cancelAnimationFrame(raf);
          ro.disconnect();
          if (resizeTimer) clearTimeout(resizeTimer);
          window.removeEventListener('keydown', onKey);
          canvas.removeEventListener('pointerdown', onPointerDown);
          canvas.removeEventListener('pointermove', onPointerMove);
          canvas.removeEventListener('pointerup', onPointerUp);
          canvas.removeEventListener('pointercancel', onPointerUp);
          destroyGrid();
          gl.deleteTexture(kernelTex);
          gl.deleteTexture(patternTex);
          gl.deleteProgram(progUpdate);
          gl.deleteProgram(progTrail);
          gl.deleteProgram(progStamp);
          gl.deleteProgram(progStir);
          gl.deleteProgram(progDisplay);
          gl.deleteVertexArray(vao);
          gl.getExtension('WEBGL_lose_context') && gl.getExtension('WEBGL_lose_context').loseContext();
          canvas.remove();
          ui.innerHTML = '';
        }
      };
    }
  };
})();

</script>
<script>
/* сцена: mandelbulb */
(function () {
  'use strict';
  const SCENES = (window.SCENES = window.SCENES || {});

  // ---------------------------------------------------------------------
  // GLSL: full-screen triangle vertex shader
  // ---------------------------------------------------------------------
  const VERT_SRC = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

  // ---------------------------------------------------------------------
  // GLSL: ray-marched Mandelbulb fragment shader
  // ---------------------------------------------------------------------
  const FRAG_SRC = `#version 300 es
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uPower;
uniform vec3  uCamPos;
uniform vec3  uCamTarget;
uniform float uFov;
out vec4 fragColor;

// cheap 2D hash, used to dither the dark background so its smooth
// gradient doesn't band.
float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// Distance estimator for the Mandelbulb: iterate z -> z^n + c in spherical
// (triplex) coordinates and use Hubbard-Douady's DE = 0.5 * ln(r) * r / dr,
// where dr tracks the running derivative magnitude of the orbit. "trap"
// collects the minimum |x|, |y|, |z| and radius seen along the orbit -
// classic "orbit trap" data used later to colour the surface by its
// internal structure instead of by iteration count.
const int ITER = 9;
const float BAILOUT = 4.0;

float mandelbulbDE(vec3 p, float power, out vec4 trap) {
  vec3 z = p;
  float dr = 1.0;
  float r = 0.0;
  trap = vec4(1e5);
  for (int i = 0; i < ITER; i++) {
    r = max(length(z), 1e-8);
    if (r > BAILOUT) break;
    trap = min(trap, vec4(abs(z.x), abs(z.y), abs(z.z), r));

    float theta = acos(clamp(z.z / r, -1.0, 1.0));
    float phi = atan(z.y, z.x);
    dr = pow(r, power - 1.0) * power * dr + 1.0;

    float zr = pow(r, power);
    theta *= power;
    phi *= power;

    z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta));
    z += p;
  }
  return 0.5 * log(r) * r / dr;
}

vec3 calcNormal(vec3 p, float power, float e) {
  vec4 tr;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * mandelbulbDE(p + k.xyy * e, power, tr) +
    k.yyx * mandelbulbDE(p + k.yyx * e, power, tr) +
    k.yxy * mandelbulbDE(p + k.yxy * e, power, tr) +
    k.xxx * mandelbulbDE(p + k.xxx * e, power, tr)
  );
}

// Short march toward the light, taking the minimum ratio of distance to
// travelled length as a cheap soft-shadow penumbra term.
float softShadow(vec3 ro, vec3 rd, float power) {
  float res = 1.0;
  float t = 0.01;
  for (int i = 0; i < 20; i++) {
    vec4 tr;
    float d = mandelbulbDE(ro + rd * t, power, tr);
    if (d < 0.0006) return 0.0;
    res = min(res, 9.0 * d / t);
    t += clamp(d, 0.01, 0.18);
    if (t > 2.2) break;
  }
  return clamp(res, 0.0, 1.0);
}

// Ambient occlusion by sampling the DE a few steps out along the normal -
// a surface tucked into a crevice reports a smaller distance than its
// nominal offset, which this turns into a darkening factor.
float calcAO(vec3 p, vec3 n, float power) {
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.02 + 0.09 * float(i) / 4.0;
    vec4 tr;
    float d = mandelbulbDE(p + n * h, power, tr);
    occ += (h - d) * sca;
    sca *= 0.7;
  }
  return clamp(1.0 - 2.1 * occ, 0.0, 1.0);
}

// Filmic (ACES-ish) tone curve - keeps the ivory highlights from clipping
// to flat white and gives the shadows a gentle roll-off.
vec3 tonemap(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

// Orbit-trap palette: a mineral specimen - pale ivory/bone on the smooth
// outer lobes, oxidised verdigris and warm copper welling up in the folds
// and creases where the orbit stayed close to the axes.
vec3 shadeAlbedo(vec4 trap, float ao, vec3 p) {
  vec3 verdigris = vec3(0.110, 0.440, 0.355);
  vec3 copper    = vec3(0.680, 0.335, 0.130);
  // paler bone/ivory (~#D9CBB0 at the pale end) so exposed convex lobes
  // read as warm bone/ivory once lit, instead of settling into a muddy
  // mid-grey - and reached over a wider range of "core" so more of the
  // smooth surface gets there, not just the very centre of each lobe.
  vec3 bone      = vec3(0.680, 0.620, 0.500);
  vec3 ivory     = vec3(0.880, 0.800, 0.640);

  // smooth outer lobes: bone through to bright ivory, varied a little by
  // how deep the orbit dove during iteration (trap.w).
  float core = clamp(trap.w * 2.3, 0.0, 1.0);
  vec3 base = mix(bone, ivory, smoothstep(0.05, 0.6, core));

  // crevices - detected from the orbit trap, which dips reliably wherever
  // the surface folds toward the symmetry axes - pick up an oxidised
  // patina. Which of copper or verdigris dominates a given fold is a slow
  // spatial pattern over the surface point itself, deliberately decoupled
  // from the fold detector so both colours appear as separate patches
  // rather than one hue always winning where the patina actually shows.
  float fold = 1.0 - smoothstep(0.0, 0.32, min(trap.x, trap.y));
  float marble = sin(p.x * 5.0) * sin(p.y * 4.3 + 1.7) * sin(p.z * 6.1 + 0.4);
  float hueMix = smoothstep(-0.2, 0.2, marble);
  vec3 patina = mix(verdigris, copper, hueMix);
  return mix(base, patina, fold * 0.72);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  vec3 fwd = normalize(uCamTarget - uCamPos);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  // uv spans roughly [-0.5, 0.5] vertically, so the focal length that maps
  // that span to the requested vertical FOV is 0.5 / tan(fov/2), not 1/tan(fov/2).
  // On a portrait/narrow canvas that alone would only fit the *vertical*
  // extent and crop the sides, so the FOV is widened by the aspect ratio
  // whenever width < height - the bulb then always fits the smaller side.
  float fitScale = min(uRes.x / uRes.y, 1.0);
  float focal = (0.5 / tan(uFov * 0.5)) * fitScale;
  vec3 rd = normalize(uv.x * right + uv.y * up + focal * fwd);
  vec3 ro = uCamPos;
  float pixelAngle = 1.0 / (uRes.y * focal);

  // background: a soft warm-to-cool pool of light - like a spotlight
  // falling on black velvet - offset toward the key light, fading fast
  // to near-black at the edges so the shell's dark UI reads cleanly on top.
  // Normalized by the SHORTER side (not uRes.y) so the pool stays a
  // compact, roughly circular glow on a tall/narrow phone canvas too -
  // uv itself is stretched vertically there and would otherwise leave
  // the "warm" zone covering almost the entire portrait screen.
  vec2 uvBg = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec2 poolCenter = vec2(-0.12, 0.10);
  float rUV = length(uvBg - poolCenter);
  vec3 bgWarm = vec3(0.075, 0.061, 0.046);
  vec3 bgCool = vec3(0.013, 0.015, 0.023);
  vec3 bgEdge = vec3(0.0020, 0.0023, 0.0035);
  vec3 bg = mix(bgWarm, bgCool, smoothstep(0.0, 0.55, rUV));
  bg = mix(bg, bgEdge, smoothstep(0.45, 1.15, rUV));

  bool hit = false;
  vec4 trap = vec4(1e5);
  float glow = 0.0;
  float t = 0.0;

  // bounding-sphere early out: the bulb never strays past this radius, so
  // rays that miss it entirely skip straight to the background.
  const float BOUND = 1.3;
  float b = dot(ro, rd);
  float cq = dot(ro, ro) - BOUND * BOUND;
  float h2 = b * b - cq;
  if (h2 > 0.0) {
    float sh = sqrt(h2);
    t = max(-b - sh, 0.0);
    float tFar = -b + sh;
    for (int i = 0; i < 140; i++) {
      if (t > tFar) break;
      vec3 p = ro + rd * t;
      vec4 tr;
      float d = mandelbulbDE(p, uPower, tr);
      glow += exp(-d * 34.0) * 0.045;
      // epsilon scales with the ray's footprint (distance travelled times
      // the angle one pixel subtends) so marching stops a fraction of a
      // pixel from the true surface instead of chasing sub-pixel detail
      // that would otherwise alias into stippled noise at low quality.
      float hitEps = max(pixelAngle * t * 1.3, 0.0004);
      if (d < hitEps) { hit = true; trap = tr; break; }
      t += d * 0.92; // relaxed step: the DE overshoots slightly at high n
    }
  }

  vec3 col = bg;
  if (hit) {
    vec3 p = ro + rd * t;
    // the normal-estimation offset scales with the same ray footprint as
    // hitEps, for the same reason: a fixed tiny offset resolves detail
    // finer than a pixel can represent and reads back as speckle.
    float nEps = clamp(pixelAngle * t * 1.0, 0.00015, 0.01);
    vec3 n = calcNormal(p, uPower, nEps);
    float ao = calcAO(p, n, uPower);
    vec3 albedo = shadeAlbedo(trap, ao, p);

    // key: one strong warm ~3200K spotlight from upper-left. This alone
    // does most of the modelling - everything else is a supporting light.
    vec3 lightDir = normalize(vec3(-0.55, 0.78, 0.30));
    float diff = max(dot(n, lightDir), 0.0);
    float shadow = softShadow(p + n * 0.003, lightDir, uPower);
    vec3 keyColor = vec3(1.0, 0.78, 0.53); // ~3200K tungsten
    // ~1.8x brighter than the first pass: lobes facing the key should be
    // the brightest thing in frame, reading as warm ivory/bone, not grey.
    vec3 key = keyColor * pow(diff, 1.4) * shadow * 2.3;

    // fill: much weaker and cool - stands in for bounced light so the
    // shadow side doesn't go pure flat; AO does the real darkening.
    vec3 fillColor = vec3(0.026, 0.046, 0.082);
    vec3 fill = fillColor * (0.5 + 0.5 * n.y);

    // rim/back light: a cool edge light that brightens the silhouette as
    // seen from the camera, independent of the key direction - contrasts
    // with the warm key like a spotlight's rim falling into a dark room.
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    vec3 rimCol = vec3(0.42, 0.56, 0.60) * rim * 0.55;

    // specular: Blinn-Phong (a tight core plus a softer, wider lobe) times
    // a Schlick fresnel term - a cheap GGX-lite that gives the ivory a
    // polished sheen that blooms a little at grazing angles, rather than a
    // single hard plastic dot. Masked to the paler albedo so patina stays matte.
    vec3 halfV = normalize(lightDir - rd);
    float NoH = max(dot(n, halfV), 0.0);
    float NoV = max(dot(n, -rd), 0.0);
    float fres = 0.04 + 0.96 * pow(1.0 - NoV, 5.0);
    float spec = (pow(NoH, 70.0) * 0.7 + pow(NoH, 16.0) * 0.3) * fres * shadow;
    float albedoLum = dot(albedo, vec3(0.299, 0.587, 0.114));
    float shineMask = smoothstep(0.22, 0.6, albedoLum);

    vec3 lit = albedo * (key + fill * ao) + rimCol * ao
             + vec3(1.0, 0.95, 0.88) * spec * shineMask * 0.9;

    // ambient occlusion pushes deep folds toward near-black rather than
    // flat grey - this is most of what makes the surface read as carved
    // stone rather than a uniformly-lit blob, and gives the wide range
    // from bright bone highlights down to near-black recesses.
    vec3 shadowTint = vec3(0.009, 0.015, 0.030);
    lit *= mix(shadowTint, vec3(1.0), pow(ao, 1.6));

    col = mix(lit, bg, smoothstep(BOUND * 2.0, 9.0, t));
  }

  // faint atmospheric haze from near-miss rays - kept subtle so it reads as
  // depth/fog rather than a glow outlining the whole silhouette.
  vec3 glowColor = vec3(0.16, 0.32, 0.28);
  col += glowColor * min(glow, 0.7) * 0.10;

  col = tonemap(col * 1.0);
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  col *= 1.0 - 0.30 * dot(uv, uv); // vignette
  col += (hash21(gl_FragCoord.xy * 1.7 + 11.0) - 0.5) * 0.006; // de-band

  fragColor = vec4(col, 1.0);
}
`;

  function compileShader(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('mandelbulb shader compile error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function buildProgram(gl) {
    const vs = compileShader(gl, gl.VERTEX_SHADER, VERT_SRC);
    const fs = compileShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('mandelbulb program link error:', gl.getProgramInfoLog(prog));
      gl.deleteProgram(prog);
      return null;
    }
    return prog;
  }

  SCENES.mandelbulb = {
    id: 'mandelbulb',
    name: 'Мандельбульб',
    tagline: 'Трёхмерный фрактал: бесконечная деталь из одной строчки формулы',
    about:
      'Возьмите точку, возведите её в n-ю степень в сферических координатах и прибавьте исходную ' +
      'точку — и повторяйте. Точки, которые не улетают в бесконечность, образуют эту минеральную ' +
      'поверхность. Приблизьтесь — и деталей меньше не станет: показатель степени медленно ' +
      'меняется, и в породе прорастают новые грани.',
    spec: [
      ['Формула', 'z ↦ zⁿ + c'],
      ['Степень', 'n = 6…9, плавно'],
      ['Итераций', '9'],
      ['Оценка расстояния', '½·ln r · r / dr'],
      ['Шагов луча', 'до 140'],
      ['Освещение', 'мягкие тени, AO, орбитальные ловушки']
    ],
    hint: 'Тяните — вращение · колесо или щипок — зум',
    accent: '#C68A56',

    mount(host, ui) {
      const canvas = document.createElement('canvas');
      canvas.style.display = 'block';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.touchAction = 'none';
      host.appendChild(canvas);

      const gl = canvas.getContext('webgl2');
      if (!gl) {
        const div = document.createElement('div');
        div.className = 'scene-fallback';
        div.textContent = 'Для этой сцены нужен WebGL2 — откройте страницу в свежем Chrome, Firefox или Safari.';
        host.appendChild(div);
        return {
          unmount() {
            host.removeChild(div);
            host.removeChild(canvas);
          }
        };
      }

      const program = buildProgram(gl);
      let raf = 0;
      let disposed = false;

      // -- geometry: one full-screen triangle -----------------------------
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      const uniforms = {};
      if (program) {
        ['uRes', 'uTime', 'uPower', 'uCamPos', 'uCamTarget', 'uFov'].forEach((name) => {
          uniforms[name] = gl.getUniformLocation(program, name);
        });
      }

      // -- camera state -----------------------------------------------------
      const DEFAULTS = { azimuth: 0.6, elevation: 0.22, zoom: 1.0 };
      let azimuth = DEFAULTS.azimuth;
      let elevation = DEFAULTS.elevation;
      let zoomTarget = DEFAULTS.zoom;
      let zoom = DEFAULTS.zoom; // damped toward zoomTarget each frame
      let lastInteract = -999;

      // -- toggles ------------------------------------------------------
      let morphing = true;
      let paused = false;
      let power = 8.0;

      // -- adaptive quality (contract: heavy ray-marcher starts at 0.5) ---
      const fixedQ = host.dataset.fixedQuality ? parseFloat(host.dataset.fixedQuality) : null;
      let quality = fixedQ != null && !Number.isNaN(fixedQ) ? fixedQ : 0.5;
      let frameTimeSum = 0;
      let frameTimeCount = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.round(host.clientWidth * dpr * quality));
        const h = Math.max(1, Math.round(host.clientHeight * dpr * quality));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }
      resize();
      const ro = new ResizeObserver(() => resize());
      ro.observe(host);

      // -- pointer input: drag to rotate, wheel / pinch to zoom -----------
      const pointers = new Map();
      let pinchStartDist = 0;
      let pinchStartZoom = 1;
      // release inertia: a single-finger drag leaves behind an angular
      // velocity (rad/s) that keeps spinning the view and decays away.
      let velAzimuth = 0;
      let velElevation = 0;
      let lastMoveTime = 0;

      function pointerDist() {
        const pts = Array.from(pointers.values());
        const dx = pts[0].x - pts[1].x;
        const dy = pts[0].y - pts[1].y;
        return Math.hypot(dx, dy);
      }

      function onPointerDown(e) {
        canvas.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        lastInteract = performance.now() / 1000;
        lastMoveTime = lastInteract;
        // grabbing the view again cancels any fling still playing out
        velAzimuth = 0;
        velElevation = 0;
        if (pointers.size === 2) {
          pinchStartDist = pointerDist();
          pinchStartZoom = zoomTarget;
        }
      }
      function onPointerMove(e) {
        const pt = pointers.get(e.pointerId);
        if (!pt) return;
        const dx = e.clientX - pt.x;
        const dy = e.clientY - pt.y;
        const now = performance.now() / 1000;
        lastInteract = now;
        if (pointers.size === 1) {
          const dAz = -dx * 0.0055;
          const dEl = -dy * 0.0055;
          azimuth += dAz;
          elevation = Math.max(-1.3, Math.min(1.3, elevation + dEl));
          // instantaneous drag speed, smoothed a little, becomes the fling
          // velocity carried into the release-inertia phase below. Clamped
          // so a very short dtMove (e.g. two synthetic events fired back
          // to back) can't produce an absurd speed that takes far longer
          // than intended to decay away.
          const dtMove = Math.max(1 / 240, now - lastMoveTime);
          velAzimuth = clamp(velAzimuth + (dAz / dtMove - velAzimuth) * 0.6, -9, 9);
          velElevation = clamp(velElevation + (dEl / dtMove - velElevation) * 0.6, -9, 9);
          lastMoveTime = now;
          pt.x = e.clientX;
          pt.y = e.clientY;
        } else if (pointers.size === 2) {
          pt.x = e.clientX;
          pt.y = e.clientY;
          const d = pointerDist();
          if (pinchStartDist > 1) {
            zoomTarget = clamp(pinchStartZoom * (pinchStartDist / Math.max(d, 1)), 0.45, 2.4);
          }
        }
      }
      function onPointerUp(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) { pinchStartDist = 0; }
        lastInteract = performance.now() / 1000;
      }
      function onWheel(e) {
        e.preventDefault();
        zoomTarget = clamp(zoomTarget * Math.exp(e.deltaY * 0.0011), 0.45, 2.4);
        lastInteract = performance.now() / 1000;
      }
      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      canvas.addEventListener('wheel', onWheel, { passive: false });

      // -- controls ---------------------------------------------------------
      const btnMorph = document.createElement('button');
      btnMorph.type = 'button';
      btnMorph.className = 'ctl';
      btnMorph.textContent = 'Морфинг';
      btnMorph.setAttribute('aria-pressed', 'true');
      btnMorph.addEventListener('click', () => {
        morphing = !morphing;
        btnMorph.setAttribute('aria-pressed', String(morphing));
      });

      const btnPause = document.createElement('button');
      btnPause.type = 'button';
      btnPause.className = 'ctl';
      btnPause.textContent = 'Пауза';
      btnPause.setAttribute('aria-pressed', 'false');
      btnPause.addEventListener('click', () => togglePause());

      const btnReset = document.createElement('button');
      btnReset.type = 'button';
      btnReset.className = 'ctl';
      btnReset.textContent = 'Сброс';
      btnReset.addEventListener('click', () => reset());

      ui.appendChild(btnMorph);
      ui.appendChild(btnPause);
      ui.appendChild(btnReset);

      function togglePause() {
        paused = !paused;
        btnPause.setAttribute('aria-pressed', String(paused));
      }
      function reset() {
        azimuth = DEFAULTS.azimuth;
        elevation = DEFAULTS.elevation;
        zoomTarget = DEFAULTS.zoom;
        zoom = DEFAULTS.zoom;
        simTime = 0;
        paused = false;
        btnPause.setAttribute('aria-pressed', 'false');
      }

      function onKeyDown(e) {
        const target = e.target;
        if (target && (target.tagName === 'INPUT' || target.tagName === 'BUTTON')) return;
        if (e.code === 'Space') { e.preventDefault(); togglePause(); }
        else if (e.code === 'KeyR') { reset(); }
      }
      window.addEventListener('keydown', onKeyDown);

      // -- animation loop -----------------------------------------------
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      let simTime = 0;
      let last = performance.now() / 1000;

      function frame(now) {
        raf = requestAnimationFrame(frame);
        const t0 = performance.now();
        const nowS = t0 / 1000;
        const dt = Math.min(0.05, nowS - last);
        last = nowS;
        if (!paused) simTime += dt;

        // fractal breathing: power drifts between ~6 and ~9, or eases to
        // exactly 8 when morphing is frozen off.
        if (morphing) {
          power = 7.5 + 1.5 * Math.sin(simTime * 0.08);
        } else {
          power += (8.0 - power) * Math.min(1, dt * 1.5);
        }

        // release inertia: while no finger is on the canvas, spend down the
        // velocity left over from the last drag - an exponential decay
        // with a ~0.2s time constant, i.e. essentially stopped by ~0.6s.
        if (pointers.size === 0 && !paused && (Math.abs(velAzimuth) > 1e-4 || Math.abs(velElevation) > 1e-4)) {
          azimuth += velAzimuth * dt;
          elevation = Math.max(-1.3, Math.min(1.3, elevation + velElevation * dt));
          const decay = Math.exp(-dt * 5.0);
          velAzimuth *= decay;
          velElevation *= decay;
        }

        const motionScale = reduceMotion && reduceMotion.matches ? 0.35 : 1.0;
        const idle = nowS - lastInteract > 4.0;
        if (idle && !paused) {
          azimuth += 0.028 * motionScale * dt;
          const elevTarget = 0.20 * Math.sin(simTime * 0.037);
          elevation += (elevTarget - elevation) * Math.min(1, dt * 0.5);
        }
        // damp the user's zoom toward its target so wheel/pinch input eases
        // in rather than snapping the camera distance in one frame.
        zoom += (zoomTarget - zoom) * Math.min(1, dt * 8);

        // orbit distance breathes slowly between a full-specimen view (bulb
        // filling ~60% of the shorter side) and a close pass where the
        // surface fills most of the frame and fine detail shows; zoom
        // scales on top. The lower safety clamp keeps the camera from ever
        // punching through the bounding sphere even at maximum pinch-in.
        const distBreathe = 2.6 + 1.6 * (0.5 + 0.5 * Math.sin(simTime * 0.05 * motionScale + 1.3));
        const distance = clamp(distBreathe * zoom, 1.7, 9.0);

        const camTarget = [0, 0, 0];
        const camPos = [
          distance * Math.cos(elevation) * Math.sin(azimuth),
          distance * Math.sin(elevation),
          distance * Math.cos(elevation) * Math.cos(azimuth)
        ];

        if (program) {
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.useProgram(program);
          gl.bindVertexArray(vao);
          gl.uniform2f(uniforms.uRes, canvas.width, canvas.height);
          gl.uniform1f(uniforms.uTime, simTime);
          gl.uniform1f(uniforms.uPower, power);
          gl.uniform3f(uniforms.uCamPos, camPos[0], camPos[1], camPos[2]);
          gl.uniform3f(uniforms.uCamTarget, camTarget[0], camTarget[1], camTarget[2]);
          gl.uniform1f(uniforms.uFov, 38 * Math.PI / 180);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindVertexArray(null);
        }

        if (fixedQ == null) {
          const ft = performance.now() - t0;
          frameTimeSum += ft;
          frameTimeCount++;
          if (frameTimeCount >= 30) {
            const avg = frameTimeSum / frameTimeCount;
            if (avg > 22) quality = Math.max(0.3, quality * 0.85);
            else if (avg < 12) quality = Math.min(1, quality * 1.1);
            frameTimeSum = 0;
            frameTimeCount = 0;
            resize();
          }
        }
      }
      raf = requestAnimationFrame(frame);

      return {
        unmount() {
          if (disposed) return;
          disposed = true;
          cancelAnimationFrame(raf);
          ro.disconnect();
          canvas.removeEventListener('pointerdown', onPointerDown);
          canvas.removeEventListener('pointermove', onPointerMove);
          canvas.removeEventListener('pointerup', onPointerUp);
          canvas.removeEventListener('pointercancel', onPointerUp);
          canvas.removeEventListener('wheel', onWheel);
          window.removeEventListener('keydown', onKeyDown);
          if (program) gl.deleteProgram(program);
          gl.deleteBuffer(vbo);
          gl.deleteVertexArray(vao);
          gl.getExtension('WEBGL_lose_context')?.loseContext();
          host.removeChild(canvas);
          ui.innerHTML = '';
        }
      };
    }
  };
})();

</script>
<script>
/* оболочка: shell.js */
/*
  «Три невозможные вещи» — shell.
  Mounts/unmounts scenes from window.SCENES, drives the overlay chrome,
  keyboard shortcuts, fullscreen, hidden-UI mode and the #hash deep link.
  Dependency-free, defensive: a scene that throws never takes the page down.
*/
(function () {
  'use strict';

  var SCENE_ORDER = ['gargantua', 'lenia', 'mandelbulb'];
  var ROMAN = { gargantua: 'I', lenia: 'II', mandelbulb: 'III' };
  var DEFAULT_SCENE = 'gargantua';
  var DEFAULT_ACCENT = '#f2b880';
  var VEIL_MS = 350;
  var FADE_MS = 180;

  var reduceMotion = false;
  var transitioning = false;
  var uiHidden = false;
  var current = null; // { id, def, handle }

  // DOM refs, filled in on boot.
  var stage, veil, chrome_, sceneUi;
  var btnHide, btnFullscreen, btnShow;
  var infoPanel, infoToggle, infoDetails;
  var sceneIndexEl, sceneNameEl, sceneTaglineEl, sceneAboutEl, sceneSpecEl, sceneHintEl;
  var switchButtons;

  function $(id) {
    return document.getElementById(id);
  }

  function availableScenes() {
    var s = window.SCENES || {};
    return SCENE_ORDER.filter(function (id) {
      return !!s[id];
    });
  }

  function isFormTarget(el) {
    if (!el) return false;
    var tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }

  function idFromHash() {
    var h = (location.hash || '').replace('#', '');
    return SCENE_ORDER.indexOf(h) !== -1 ? h : null;
  }

  function renderSpec(pairs) {
    sceneSpecEl.innerHTML = '';
    (pairs || []).forEach(function (pair) {
      var dt = document.createElement('dt');
      dt.textContent = pair[0];
      var dd = document.createElement('dd');
      dd.textContent = pair[1];
      sceneSpecEl.appendChild(dt);
      sceneSpecEl.appendChild(dd);
    });
  }

  function updateSwitcherState(id) {
    switchButtons.forEach(function (btn) {
      var isCurrent = btn.getAttribute('data-scene') === id;
      btn.setAttribute('aria-current', isCurrent ? 'true' : 'false');
    });
  }

  function fillInfoPanel(def) {
    sceneIndexEl.textContent = ROMAN[def.id] || '';
    sceneNameEl.textContent = def.name || '';
    sceneTaglineEl.textContent = def.tagline || '';
    sceneAboutEl.textContent = def.about || '';
    renderSpec(def.spec);
    sceneHintEl.textContent = def.hint || '';
  }

  function updateInfoPanel(def) {
    if (reduceMotion) {
      fillInfoPanel(def);
      return;
    }
    infoPanel.classList.add('is-fading');
    window.setTimeout(function () {
      fillInfoPanel(def);
      infoPanel.classList.remove('is-fading');
    }, FADE_MS);
  }

  function showFallback(message) {
    stage.innerHTML = '';
    var fb = document.createElement('div');
    fb.className = 'scene-fallback';
    fb.textContent = message;
    stage.appendChild(fb);
  }

  // Unmounts the current scene (if any), mounts `id`, updates chrome. No veil.
  function performSwitch(id) {
    var def = (window.SCENES || {})[id];
    if (!def) return;

    if (current && current.handle) {
      try {
        current.handle.unmount();
      } catch (err) {
        console.error('[shell] unmount error for ' + current.id, err);
      }
    }

    stage.innerHTML = '';
    sceneUi.innerHTML = '';

    var handle = null;
    try {
      handle = def.mount(stage, sceneUi) || null;
    } catch (err) {
      console.error('[shell] mount error for ' + id, err);
      showFallback('Сцена «' + (def.name || id) + '» сейчас не может запуститься. Попробуйте обновить страницу.');
      handle = null;
    }

    current = { id: id, def: def, handle: handle };
    updateInfoPanel(def);
    updateSwitcherState(id);
    document.documentElement.style.setProperty('--accent', def.accent || DEFAULT_ACCENT);
    try {
      history.replaceState(null, '', '#' + id);
    } catch (err) {
      /* ignore — e.g. sandboxed file:// edge cases */
    }
  }

  function switchTo(id) {
    if (transitioning) return;
    if (!window.SCENES || !window.SCENES[id]) return;
    if (current && current.id === id) return;

    if (reduceMotion) {
      performSwitch(id);
      return;
    }

    transitioning = true;
    veil.classList.add('is-visible');
    window.setTimeout(function () {
      performSwitch(id);
      // Let the fresh DOM paint once before fading the veil back out.
      requestAnimationFrame(function () {
        veil.classList.remove('is-visible');
        window.setTimeout(function () {
          transitioning = false;
        }, VEIL_MS);
      });
    }, VEIL_MS);
  }

  function stepScene(delta) {
    var scenes = availableScenes();
    if (!scenes.length) return;
    var idx = current ? scenes.indexOf(current.id) : -1;
    if (idx === -1) idx = 0;
    var next = (idx + delta + scenes.length) % scenes.length;
    switchTo(scenes[next]);
  }

  // ---------- hidden-UI mode ----------

  function setUiHidden(hidden) {
    uiHidden = hidden;
    chrome_.classList.toggle('is-hidden', hidden);
    chrome_.setAttribute('aria-hidden', hidden ? 'true' : 'false');
    btnHide.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    btnShow.hidden = !hidden;
  }

  function toggleUiHidden() {
    setUiHidden(!uiHidden);
  }

  // ---------- fullscreen ----------

  function fullscreenSupported() {
    return !!(document.documentElement.requestFullscreen && document.exitFullscreen);
  }

  function toggleFullscreen() {
    if (!fullscreenSupported()) return;
    if (!document.fullscreenElement) {
      var p = document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    } else {
      var p2 = document.exitFullscreen();
      if (p2 && p2.catch) p2.catch(function () {});
    }
  }

  function onFullscreenChange() {
    btnFullscreen.setAttribute('aria-pressed', document.fullscreenElement ? 'true' : 'false');
  }

  // ---------- mobile info toggle ----------

  function setInfoExpanded(expanded) {
    infoToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    infoToggle.textContent = expanded ? 'Свернуть' : 'Подробнее';
    infoPanel.classList.toggle('is-expanded', expanded);
  }

  function toggleInfoExpanded() {
    setInfoExpanded(infoToggle.getAttribute('aria-expanded') !== 'true');
  }

  // ---------- keyboard ----------

  function onKeydown(e) {
    if (e.defaultPrevented) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isFormTarget(e.target)) return;

    switch (e.code) {
      case 'Digit1':
        switchTo(SCENE_ORDER[0]);
        break;
      case 'Digit2':
        switchTo(SCENE_ORDER[1]);
        break;
      case 'Digit3':
        switchTo(SCENE_ORDER[2]);
        break;
      case 'ArrowLeft':
        stepScene(-1);
        break;
      case 'ArrowRight':
        stepScene(1);
        break;
      case 'KeyH':
        toggleUiHidden();
        break;
      case 'KeyF':
        toggleFullscreen();
        break;
      case 'Escape':
        if (uiHidden) {
          setUiHidden(false);
        } else if (infoToggle.getAttribute('aria-expanded') === 'true') {
          setInfoExpanded(false);
        }
        break;
      default:
        return;
    }
  }

  // ---------- boot ----------

  function cacheDom() {
    stage = $('stage');
    veil = $('veil');
    chrome_ = $('chrome');
    sceneUi = $('scene-ui');
    btnHide = $('btn-hide');
    btnFullscreen = $('btn-fullscreen');
    btnShow = $('btn-show');
    infoPanel = $('info-panel');
    infoToggle = $('info-toggle');
    infoDetails = $('info-details');
    sceneIndexEl = $('scene-index');
    sceneNameEl = $('scene-name');
    sceneTaglineEl = $('scene-tagline');
    sceneAboutEl = $('scene-about');
    sceneSpecEl = $('scene-spec');
    sceneHintEl = $('scene-hint');
    switchButtons = Array.prototype.slice.call(document.querySelectorAll('.switch-btn'));
  }

  function wireEvents() {
    btnHide.addEventListener('click', toggleUiHidden);
    btnShow.addEventListener('click', toggleUiHidden);

    if (fullscreenSupported()) {
      btnFullscreen.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', onFullscreenChange);
    } else {
      btnFullscreen.hidden = true;
    }

    infoToggle.addEventListener('click', toggleInfoExpanded);

    switchButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        switchTo(btn.getAttribute('data-scene'));
      });
    });

    document.addEventListener('keydown', onKeydown);
  }

  // Dev/test hook only: a `?q=0.35`-style query param pins scene quality so
  // screenshots taken under a slow software GPU are deterministic. Scenes
  // read `host.dataset.fixedQuality` themselves (see CONTRACT.md); normal
  // visitors never pass this param, so this is a no-op for them.
  function applyFixedQualityFromQuery() {
    try {
      var params = new URLSearchParams(location.search);
      var q = params.get('q');
      if (q) stage.dataset.fixedQuality = q;
    } catch (err) {
      /* ignore — malformed query string or no URLSearchParams support */
    }
  }

  function boot() {
    cacheDom();
    wireEvents();
    applyFixedQualityFromQuery();

    try {
      reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (err) {
      reduceMotion = false;
    }

    var scenes = availableScenes();

    switchButtons.forEach(function (btn) {
      var id = btn.getAttribute('data-scene');
      btn.hidden = scenes.indexOf(id) === -1;
    });

    if (!scenes.length) {
      showFallback('Сцены не найдены. Проверьте, что файлы src/scenes/*.js подключены.');
      return;
    }

    var initial = idFromHash();
    if (!initial || scenes.indexOf(initial) === -1) {
      initial = scenes.indexOf(DEFAULT_SCENE) !== -1 ? DEFAULT_SCENE : scenes[0];
    }

    performSwitch(initial);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
