<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гаргантюа — dev</title>
<style>
  html, body { margin: 0; background: #05060a; }
  #host { position: fixed; inset: 0; }
  #ui { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 2; }
  .ctl {
    font: 13px/1.2 system-ui, sans-serif;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20,20,25,0.55);
    color: #fff;
    cursor: pointer;
  }
  .ctl[aria-pressed="true"] { background: rgba(242,184,128,0.35); border-color: #F2B880; }
  .scene-fallback {
    color: #fff; font: 15px/1.4 system-ui, sans-serif;
    padding: 24px; max-width: 420px;
  }
</style>
</head>
<body>
<div id="host"></div>
<div id="ui"></div>
<script src="../src/scenes/gargantua.js"></script>
<script>
  const host = document.getElementById('host');
  const ui = document.getElementById('ui');
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if (q) host.dataset.fixedQuality = q;

  let h = SCENES.gargantua.mount(host, ui);
  window.__remount = () => {
    h.unmount();
    h = SCENES.gargantua.mount(host, ui);
  };
</script>
</body>
</html>
