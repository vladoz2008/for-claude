<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mandelbulb dev</title>
<style>
  html, body { margin: 0; background: #05060a; }
  #host { position: fixed; inset: 0; }
  #ui { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 2; }
  .ctl {
    font: 13px/1.4 system-ui, sans-serif;
    color: #eee;
    background: rgba(20, 22, 28, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .ctl[aria-pressed="true"] { background: rgba(255, 255, 255, 0.22); }
  .scene-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eee; font: 16px system-ui, sans-serif; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>
<div id="host"></div>
<div id="ui"></div>
<script src="../src/scenes/mandelbulb.js"></script>
<script>
  const host = document.getElementById('host');
  const ui = document.getElementById('ui');
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if (q) host.dataset.fixedQuality = q;
  let h = window.SCENES.mandelbulb.mount(host, ui);
  window.__remount = () => {
    h.unmount();
    h = window.SCENES.mandelbulb.mount(host, ui);
  };
</script>
</body>
</html>
